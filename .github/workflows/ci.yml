name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-justfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Parse all justfiles
        run: |
          just --list
          just --list --justfile workspace.just
          just --list --justfile repo.just

  validate-repos-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: jq empty repos.json
      - name: Check schema constraints
        run: |
          # Every entry must have a "url" string
          jq -e 'to_entries | all(.value.url | type == "string")' repos.json
          # If packages exist, each must have name and parentDir
          jq -e '
            to_entries | all(
              .value.packages // [] | all(
                has("name") and has("parentDir")
              )
            )
          ' repos.json

  test-workspace-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - name: Create workspace (template only)
        run: |
          # Manually replicate the template-copy portion of create-workspace
          # (the full recipe requires git clone + cmux which aren't available in CI)
          mkdir -p workspaces/ci-test
          cp workspaces/templates/* workspaces/ci-test/
          ln -sf "$PWD/workspace.just" workspaces/ci-test/justfile
      - name: Verify workspace files exist
        run: |
          test -f workspaces/ci-test/AGENTS.md
          test -f workspaces/ci-test/jupyter_server_config.py
          test -f workspaces/ci-test/pyproject.toml
          test -L workspaces/ci-test/justfile
          # Verify justfile symlink target is valid
          just --list --justfile workspaces/ci-test/justfile
      - name: Remove workspace
        run: rm -rf workspaces/ci-test
      - name: Verify removal
        run: test ! -d workspaces/ci-test

  test-remove-worktree-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Setup test worktrees
        run: |
          git config user.email "ci@test"
          git config user.name "CI"
          for name in wt1 wt2 wt3; do
            git worktree add -b "$name" "worktrees/$name"
          done
      - name: "Test: remove by name"
        run: |
          just rmwt wt1 --force
          test ! -d worktrees/wt1
          test -d worktrees/wt2
          test -d worktrees/wt3
      - name: "Test: --except keeps listed, removes rest"
        run: |
          just rmwt --except wt2 --force
          test -d worktrees/wt2
          test ! -d worktrees/wt3
      - name: "Test: remove last one by name"
        run: |
          just rmwt wt2 --force
          test ! -d worktrees/wt2
      - name: "Test: error when names + --except"
        run: |
          git worktree add -b wt4 worktrees/wt4
          output=$(just rmwt wt4 --except wt4 2>&1 || true)
          echo "$output" | grep -q "cannot be used with a names list"
          git worktree remove worktrees/wt4 --force
          git branch -D wt4
