name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-justfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Parse all justfiles (root + submodules)
        run: just --list --list-submodules

  validate-repos-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: jq empty repos.json
      - name: Check schema constraints
        run: |
          # Every entry must have a "url" string
          jq -e 'to_entries | all(.value.url | type == "string")' repos.json
          # If packages exist, each must have name and parentDir
          jq -e '
            to_entries | all(
              .value.packages // [] | all(
                has("name") and has("parentDir")
              )
            )
          ' repos.json

  workbench-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Configure git (worktree/branch ops need an identity)
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"
      - name: Run workbench tests
        run: just workbench-tests run-all
